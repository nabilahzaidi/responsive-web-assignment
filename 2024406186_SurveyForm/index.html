<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Survey Form</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      text-align: center;
    }

    form {
      background: white;
      max-width: 500px;
      margin: auto;
      padding: 20px;
      border-radius: 10px;
      text-align: left;
    }

    input, select, textarea {
      width: 100%;
      margin: 8px 0;
      padding: 8px;
    }

    button {
      width: 100%;
      padding: 10px;
      background: purple;
      color: white;
      border: none;
      border-radius: 5px;
    }
  </style>
</head>

<body>

  
  <h1 id="title">BTS Concert Survey</h1>

  
  <p id="description">Tell us about your BTS concert experience and preferences 💜</p>

  
  <form id="survey-form">

    
    <label id="name-label">Name:</label>
    <input 
      type="text" 
      id="name" 
      placeholder="Enter your name" 
      required>

    
    <label id="email-label">Email:</label>
    <input 
      type="email" 
      id="email" 
      placeholder="Enter your email" 
      required>

    
    <label id="number-label">Age:</label>
    <input 
      type="number" 
      id="number" 
      min="10" 
      max="60" 
      placeholder="Enter your age">

    
    <label>Which concert will you attend?</label>
    <select id="dropdown">
      <option value="">Select an option</option>
      <option value="kl">Kuala Lumpur</option>
      <option value="tokyo">Tokyo</option>
    </select>

    
    <p>Have you attended a BTS concert before?</p>
    <input type="radio" name="experience" value="yes"> Yes<br>
    <input type="radio" name="experience" value="no"> No<br>

    
    <p>What do you look forward to? (Select all)</p>
    <input type="checkbox" value="music"> Live Music<br>
    <input type="checkbox" value="dance"> Dance Performance<br>
    <input type="checkbox" value="fans"> Meeting ARMY<br>

    
    <p>Additional Comments:</p>
    <textarea rows="4" placeholder="Write your comments here..."></textarea>

  
    <button id="submit" type="submit">Submit</button>

  </form>

</body>
</html>
